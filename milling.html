<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aivo Scan — Подготовка фрезировки</title>
  <meta name="description" content="Подготовка деталей фасадов для ЧПУ — выберите фрезировку, настройте параметры и экспортируйте DXF">
  <meta name="theme-color" content="#00d4aa">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0a0a0a;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text2: rgba(255, 255, 255, 0.6);
      --text3: rgba(255, 255, 255, 0.35);
      --accent: #00D4AA;
      --accent2: #00FFB0;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }
    .bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 10% 15%, rgba(0, 212, 170, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse 70% 80% at 90% 25%, rgba(0, 140, 220, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse 60% 70% at 75% 65%, rgba(100, 60, 220, 0.2) 0%, transparent 50%),
        #0a0a0a;
    }
    .card {
      position: relative; z-index: 1;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      animation: fadeUp 0.6s var(--ease) both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .icon-wrap {
      width: 80px; height: 80px;
      background: rgba(0, 212, 170, 0.1);
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(0, 212, 170, 0.15);
    }
    .icon-wrap svg { width: 36px; height: 36px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.3px; }
    h1 .em { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .sub { font-size: 15px; color: var(--text2); line-height: 1.6; margin-bottom: 32px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255, 193, 7, 0.08);
      border: 1px solid rgba(255, 193, 7, 0.2);
      border-radius: 100px;
      padding: 8px 20px;
      font-size: 13px; font-weight: 600; color: #FFB300;
      margin-bottom: 28px;
    }
    .badge::before { content: ''; width: 6px; height: 6px; background: #FFB300; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
    .features { text-align: left; margin-bottom: 32px; }
    .feature { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; }
    .feature-icon { width: 32px; height: 32px; background: rgba(0, 212, 170, 0.08); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
    .feature-text { font-size: 13px; color: var(--text2); line-height: 1.5; }
    .feature-text strong { color: var(--text); font-weight: 600; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 14px;
      font-size: 15px; font-weight: 600;
      text-decoration: none; border: none; cursor: pointer;
      transition: all 0.3s var(--ease);
    }
    .btn-primary { background: var(--accent); color: #000; box-shadow: 0 4px 20px rgba(0, 212, 170, 0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 212, 170, 0.3); }
    .btn-glass { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); color: var(--text); }
    .btn-glass:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .nav-back {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      display: flex; align-items: center; gap: 8px;
      color: var(--text2); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 8px 16px; border-radius: 12px;
      background: var(--glass); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      transition: all 0.2s;
    }
    .nav-back:hover { color: var(--text); background: rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <a href="/" class="nav-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Назад
  </a>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
    <div class="badge">Скоро</div>
    <h1>Подготовка <span class="em">фрезировки</span></h1>
    <p class="sub">Инструмент для подготовки деталей фасадов к ЧПУ-обработке находится в разработке</p>
    <div class="features">
      <div class="feature">
        <div class="feature-icon">📐</div>
        <div class="feature-text"><strong>Выбор профиля фрезировки</strong> — прямой, скруглённый, фасонный</div>
      </div>
      <div class="feature">
        <div class="feature-icon">⚙️</div>
        <div class="feature-text"><strong>Настройка параметров</strong> — глубина, радиус, допуски</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📁</div>
        <div class="feature-text"><strong>Экспорт DXF</strong> — готовый файл для ЧПУ-станка</div>
      </div>
    </div>
    <div class="actions">
      <a href="app.html" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Открыть 3D сканер
      </a>
    </div>
  </div>
</body>
</html>
